; =============================================================================
; WLED - M5Stack CoreS3 Custom Build
;
; WLED source:
;   Latest main branch
;
; Target:
;   M5Stack CoreS3
;   ESP32-S3
;   16MB Flash
;   8MB OPI PSRAM
;
; Framework:
;   Arduino Core 2.0.18
;   ESP-IDF 4.4.8
;   GCC 8.4
;
; Usermods:
;   CoreS3_Power
;   CoreS3_Display
; =============================================================================

[platformio]

default_envs = m5stack_cores3

; =============================================================================
; M5Stack CoreS3
; =============================================================================

[env:m5stack_cores3]

; -----------------------------------------------------------------------------
; Board / Framework
; -----------------------------------------------------------------------------

board = esp32-s3-devkitc-1
framework = arduino

; -----------------------------------------------------------------------------
; ESP32 V4 framework
;
; WLED main still provides this environment:
;   Tasmota platform 2024.06.00
;   Arduino Core 2.0.18
;   ESP-IDF 4.4.8
;   GCC 8.4
; -----------------------------------------------------------------------------

platform = ${esp32_idf_V4.platform}
platform_packages = ${esp32_idf_V4.platform_packages}

; -----------------------------------------------------------------------------
; CoreS3 Memory
;
; CoreS3:
;   Flash : 16MB
;   PSRAM : 8MB OPI
; -----------------------------------------------------------------------------

board_build.arduino.memory_type = qio_opi

board_build.partitions = ${esp32.extreme_partitions}

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

board_build.f_flash = 80000000L
board_build.flash_mode = qio

; -----------------------------------------------------------------------------
; Upload / Serial Monitor
; -----------------------------------------------------------------------------

upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; -----------------------------------------------------------------------------
; CoreS3 Usermods
; -----------------------------------------------------------------------------

custom_usermods =
    CoreS3_Power
    CoreS3_Display

; -----------------------------------------------------------------------------
; Build unflags
;
; WLED main currently disables DMX input for its official V4 test build.
; Do the same here.
; -----------------------------------------------------------------------------

build_unflags =
    ${esp32_idf_V4.build_unflags}
    -D WLED_ENABLE_DMX_INPUT

; -----------------------------------------------------------------------------
; Build flags
; -----------------------------------------------------------------------------

build_flags =
    ${common.build_flags}

    ; WLED ESP32 V4 flags
    ${esp32_idf_V4.build_flags}

    ; ESP32-S3 target
    -DARDUINO_ARCH_ESP32S3
    -DCONFIG_IDF_TARGET_ESP32S3=1

    ; Native USB / USB CDC
    -DARDUINO_USB_MSC_ON_BOOT=0
    -DARDUINO_DFU_ON_BOOT=0
    -DARDUINO_USB_CDC_ON_BOOT=1

    ; PSRAM
    -DBOARD_HAS_PSRAM

    ; WLED
    -D WLED_WATCHDOG_TIMEOUT=0
    -D WLED_RELEASE_NAME=\"M5Stack_CoreS3\"

    ; CoreS3 internal I2C
    ; SDA = GPIO12
    ; SCL = GPIO11
    -D I2CSDAPIN=12
    -D I2CSCLPIN=11

; -----------------------------------------------------------------------------
; Libraries
;
; IMPORTANT:
; Do NOT use:
;
;   ${esp32_idf_V4.lib_deps}
;
; Current WLED main contains an incomplete NeoPixelBus Git commit in that
; definition. Dependencies are therefore expanded explicitly here.
; -----------------------------------------------------------------------------

lib_deps =

    ; Common ESP32 libraries
    ${esp32_all_variants.lib_deps}

    ; Common WLED libraries
    ${env.lib_deps}

    ; Correct NeoPixelBus commit
    ;
    ; WLED main currently contains:
    ;   ...bcba04f
    ;
    ; Correct commit:
    ;   ...bcba04fc
    ;
    NeoPixelBus = git+https://github.com/Makuna/NeoPixelBus#1d7ff38f14d04a976f9c6e365c83a232bcba04fc

; -----------------------------------------------------------------------------
; Libraries to ignore
; -----------------------------------------------------------------------------

lib_ignore =
    ${esp32_idf_V4.lib_ignore}

    ; DMX input is currently excluded from WLED V4 builds
    esp_dmx
    