; =============================================================================
; WLED - M5Stack CoreS3
; Phase 10.4.2P-V17f-RMT - CoreS3 Quad PSRAM + NeoPixelBus RMT test
;
; IMPORTANT:
;   Do NOT set lib_archive=yes in this active custom environment.
;
;   WLED main already contains [v5_pioarduino_workaround] with lib_archive=yes.
;   Setting lib_archive=yes directly in [env:m5stack_cores3] makes WLED's
;   validate_modules.py require every selected usermod to declare
;   "build": {"libArchive": false}, which breaks this existing usermod setup.
;
;   The actual V17f diagnostic change is NOT in this file:
;   NeoPixelBus CORE3 ESP32-S3 RMT mem_block_symbols is patched separately
;   from 192 to 48 in .pio/libdeps/m5stack_cores3/NeoPixelBus/...
;
; Goal:
;   Preserve the V17 build environment that already builds successfully,
;   preserve 8MB Quad PSRAM support, and test only the NeoPixelBus RMT
;   memory-block adjustment.
; =============================================================================

[platformio]
default_envs = m5stack_cores3

[env:m5stack_cores3]

; Reuse WLED main's 16MB ESP32-S3 environment for flash/partition settings.
; M5Stack CoreS3 specification: 16MB Flash + 8MB QUAD PSRAM.
extends = env:esp32s3dev_16MB_opi

; CoreS3 PSRAM is Quad, not Octal.
board_build.arduino.memory_type = qio_qspi
board_build.flash_mode = qio

; Current WLED V17 pioarduino environment.
; Arduino Core 3.3.9 / ESP-IDF 5.5.4 / Xtensa GCC 14.2.0
platform = ${esp32_idf_V5.platform_pioarduino}
platform_packages = ${esp32_idf_V5.platform_packages_pioarduino}

; CoreS3 usermods.
custom_usermods =
    CoreS3_Power
    CoreS3_Display
    CoreS3_Audio
    audioreactive

; Keep the upstream ESP32-S3 watchdog/unflag configuration unchanged.
build_unflags =
    ${env:esp32s3dev_16MB_opi.build_unflags}

build_flags =
    ${env:esp32s3dev_16MB_opi.build_flags}

    ; CoreS3 internal I2C bus.
    -D I2CSDAPIN=12
    -D I2CSCLPIN=11

    ; CoreS3 built-in ES7210 / AudioReactive integration.
    -D WLED_M5STACK_CORES3_AUDIO=1
    -D UM_AUDIOREACTIVE_ENABLE
    -D SR_DMTYPE=7

    ; GPIO0 is the CoreS3 ES7210 MCLK, not a WLED physical button.
    -D BTNPIN=-1
    -D BTNTYPE=0
